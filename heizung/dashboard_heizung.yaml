  - title: Schlafzimmer
    path: schlafzimmer
    icon: mdi:bed-king
    subview: true
    back_path: /dashboard-heizung/uebersicht
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              {%- macro grad(x) -%}
              {%- if x is number -%}{%- set z = '%.1f' | format(x) -%}{{ (z[:-2] if z.endswith('.0') else z) | replace('.', ',') }} °C{%- else -%}–{%- endif -%}
              {%- endmacro -%}
              {%- macro uhr(x) -%}
              {%- set d = as_local(as_datetime(x | string)) -%}
              {%- set tage = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'] -%}
              {%- if d.date() == now().date() -%}{{ d.strftime('%H:%M') }}
              {%- elif d.date() == (now() + timedelta(days=1)).date() -%}morgen {{ d.strftime('%H:%M') }}
              {%- else -%}{{ tage[d.weekday()] }} {{ d.strftime('%H:%M') }}{%- endif -%}
              {%- endmacro -%}
              {%- set vorheizen = (state_attr('input_datetime.heizung_vorheizen_bis', 'timestamp') | float(0)) > as_timestamp(now()) -%}
              {%- set k = 'schlafzimmer' -%}
              {%- set v = 'climate.heizung_schlafzimmer' -%}
              {%- set t = 'sensor.schlafzimmer_luftsensor_temperatur' -%}
              {%- set ist = states(t) | float(none) -%}
              {%- set ist = state_attr(v, 'current_temperature') if ist is none else ist -%}
              {%- set ziel = state_attr(v, 'temperature') -%}
              {%- set plan = 'schedule.heizung_' ~ k -%}
              {%- set heizzeit = is_state(plan, 'on') -%}
              {%- set da = (is_state('input_boolean.kinder_sind_da', 'on') or is_state('input_boolean.kinder_kommen', 'on')) if k == 'kinderzimmer' else is_state('binary_sensor.heizung_jemand_da', 'on') -%}
              {%- set naechst = state_attr(plan, 'next_event') -%}
              {%- set wann = uhr(naechst) if naechst else '' -%}
              {%- set heiz = ('Heizzeit bis ' ~ wann if wann else 'Heizzeit läuft') if heizzeit else ('Heizzeit ab ' ~ wann if wann else 'keine Heizzeit geplant') -%}
              {%- set timer = 'timer.heizung_handbetrieb_' ~ k -%}
              {%- set hand_bis = state_attr(timer, 'finishes_at') -%}
              {%- set modus = 'Automatik ist aus' if is_state('input_boolean.heizung_automatik', 'off')
                else 'Fenster offen – Ventil zu' if is_state('input_boolean.heizung_fenster_' ~ k, 'on')
                else ('von Hand bis ' ~ uhr(hand_bis) if hand_bis else 'von Hand') if is_state(timer, 'active')
                else 'Wohlfühl' if da and heizzeit
                else 'Wohlfühl (Vorheizen)' if da and vorheizen
                else 'Abgesenkt' if da
                else ('Keine Kinder da' if k == 'kinderzimmer' else 'Keiner da') -%}
              ## {{ grad(ist) }}
              Ziel **{{ grad(ziel) }}** · {{ modus }}<br>{{ heiz }}
          - type: heading
            heading: Temperaturen
            heading_style: subtitle
            icon: mdi:thermometer
          - type: tile
            entity: input_number.heizung_schlafzimmer_komfort
            name: Wohlfühl
            icon: mdi:white-balance-sunny
            hide_state: true
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            grid_options:
              columns: 12
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: tile
            entity: input_number.heizung_schlafzimmer_absenk
            name: Abgesenkt
            icon: mdi:weather-night
            hide_state: true
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            grid_options:
              columns: 12
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: tile
            entity: input_number.heizung_schlafzimmer_abwesend
            name: Keiner da
            icon: mdi:home-export-outline
            hide_state: true
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            grid_options:
              columns: 12
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: markdown
            content: '**Wohlfühl** gilt in der Heizzeit, wenn jemand zu Hause ist.<br>**Abgesenkt** gilt außerhalb der Heizzeit.<br>**Keiner da** gilt, wenn niemand zu Hause ist (über 1 km weg, nach 10 Minuten) – nie wärmer als Abgesenkt.'
      - type: grid
        cards:
          - type: heading
            heading: Heizzeit
            heading_style: subtitle
            icon: mdi:calendar-clock
          - type: tile
            entity: schedule.heizung_schlafzimmer
            name: Heizzeiten
            icon: mdi:calendar-clock
            grid_options:
              columns: 12
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: markdown
            content: 'Zeiten ändern: oben auf **Heizzeiten** tippen → rechts oben ⚙️ → im Wochenplan Zeiten ziehen, neue anlegen oder löschen → **Aktualisieren**.'
          - type: heading
            heading: Von Hand
            heading_style: subtitle
            icon: mdi:hand-back-right
          - type: tile
            entity: climate.heizung_schlafzimmer
            name: Schlafzimmer jetzt anders
            icon: mdi:bed-king
            state_content:
              - current_temperature
              - temperature
            grid_options:
              columns: 12
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: markdown
            content: Antippen und am Regler einstellen. Gilt 2 Stunden bzw. bis zur nächsten Heizzeit, danach wieder Automatik.

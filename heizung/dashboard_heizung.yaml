          - type: heading
            heading: Temperaturen
            heading_style: subtitle
            icon: mdi:thermometer
          - type: tile
            entity: input_number.heizung_bad_komfort
            name: Wohlfühl
            icon: mdi:white-balance-sunny
            hide_state: true
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            grid_options:
              columns: 12
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: tile
            entity: input_number.heizung_bad_absenk
            name: Abgesenkt
            icon: mdi:weather-night
            hide_state: true
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            grid_options:
              columns: 12
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: tile
            entity: input_number.heizung_bad_abwesend
            name: Keiner da
            icon: mdi:home-export-outline
            hide_state: true
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            grid_options:
              columns: 12
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: markdown
            content: '**Wohlfühl** gilt in der Heizzeit, wenn jemand zu Hause ist.<br>**Abgesenkt** gilt außerhalb der Heizzeit.<br>**Keiner da** gilt, wenn niemand zu Hause ist (über 1 km weg, nach 10 Minuten) – nie wärmer als Abgesenkt.'
      - type: grid
        cards:
          - type: heading
            heading: Heizzeit
            heading_style: subtitle
            icon: mdi:calendar-clock
          - type: tile
            entity: schedule.heizung_bad
            name: Heizzeiten
            icon: mdi:calendar-clock
            grid_options:
              columns: 12
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: markdown
            content: 'Zeiten ändern: oben auf **Heizzeiten** tippen → rechts oben ⚙️ → im Wochenplan Zeiten ziehen, neue anlegen oder löschen → **Aktualisieren**.'
          - type: heading
            heading: Von Hand
            heading_style: subtitle
            icon: mdi:hand-back-right
          - type: tile
            entity: climate.heizung_bad
            name: Bad jetzt anders
            icon: mdi:shower
            state_content:
              - current_temperature
              - temperature
            grid_options:
              columns: 12
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            card_mod:
              style: 'ha-card { border-radius: 14px; }'
          - type: markdown
            content: Antippen und am Regler einstellen. Gilt 2 Stunden bzw. bis zur nächsten Heizzeit, danach wieder Automatik.

views:
  - title: Raumplan
    path: raumplan
    icon: mdi:floor-plan
    type: panel
    cards:
      - type: grid
        columns: 3
        square: false
        cards:
          - type: vertical-stack
            cards:
              - type: heading
                heading: Schnellzugriff
                icon: mdi:gesture-tap
                heading_style: title
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: input_boolean.kinder_sind_da
                    name: Kinder sind da
                    icon: mdi:account-child
                    tap_action:
                      action: toggle
                    icon_tap_action:
                      action: toggle
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
                  - type: tile
                    entity: input_boolean.bett
                    name: Bett
                    icon: mdi:bed
                    tap_action:
                      action: toggle
                    icon_tap_action:
                      action: toggle
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
                  - type: tile
                    entity: script.alles_aus
                    name: Alles aus
                    icon: mdi:power
                    tap_action:
                      action: perform-action
                      perform_action: script.turn_on
                      target:
                        entity_id: script.alles_aus
                    icon_tap_action:
                      action: perform-action
                      perform_action: script.turn_on
                      target:
                        entity_id: script.alles_aus
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
                    hide_state: true
                  - type: tile
                    entity: script.ich_bin_wach
                    name: Ich bin wach
                    tap_action:
                      action: perform-action
                      perform_action: script.turn_on
                      target:
                        entity_id: script.ich_bin_wach
                    icon_tap_action:
                      action: perform-action
                      perform_action: script.turn_on
                      target:
                        entity_id: script.ich_bin_wach
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
                    hide_state: true
                  - type: tile
                    entity: light.morgenroutine
                    name: Morgenroutine
                    icon: mdi:weather-sunset-up
                    tap_action:
                      action: toggle
                    icon_tap_action:
                      action: toggle
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
                  - type: tile
                    entity: sensor.fernseher_status
                    name: Fernseher
                    icon: mdi:television
                    tap_action:
                      action: perform-action
                      perform_action: switch.toggle
                      target:
                        entity_id: switch.fernseher_kombiniert
                    icon_tap_action:
                      action: perform-action
                      perform_action: switch.toggle
                      target:
                        entity_id: switch.fernseher_kombiniert
                    hold_action:
                      action: more-info
                      entity: media_player.wohnzimmer_tv
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
                  - type: tile
                    entity: switch.pc
                    name: PC
                    tap_action:
                      action: more-info
                    icon_tap_action:
                      action: toggle
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
                  - type: tile
                    entity: media_player.spotify_lukas_pabst
                    name: Spotify
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
                  - type: tile
                    entity: input_boolean.kinomodus
                    name: Kinomodus
                    icon: mdi:movie-open
                    tap_action:
                      action: toggle
                    icon_tap_action:
                      action: toggle
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
                  - type: tile
                    entity: input_boolean.kinder_kommen
                    name: Kinder kommen
                    icon: mdi:account-child-outline
                    tap_action:
                      action: toggle
                    icon_tap_action:
                      action: toggle
                    vertical: true
                    card_mod:
                      style: 'ha-card { border-radius: 14px; }'
              - type: tile
                entity: binary_sensor.heizung_jemand_da
                name: Heizung
                icon: mdi:radiator
                hide_state: false
                state_content: []
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/heizung
                icon_tap_action:
                  action: navigate
                  navigation_path: /lovelace/heizung
                card_mod:
                  style: 'ha-card { border-radius: 14px; }'
              - type: heading
                heading: Morgen
                icon: mdi:weather-sunset-up
                heading_style: title
              - type: tile
                entity: input_select.morgenmusik
                name: Morgenmusik
                features:
                  - type: select-options
                features_position: bottom
                card_mod:
                  style: 'ha-card { border-radius: 14px; }'

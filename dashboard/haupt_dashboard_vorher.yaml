                  style: 'ha-card { border-radius: 14px; }'
              - type: markdown
                content: >-
                  {%- set ns = namespace(l=[], b=[], names=[]) -%}

                  {%- set rooms =
                  {'badezimmer':'Bad','kinderzimmer':'Kinderzimmer','schlafzimmer':'Schlafzimmer','kuche':'Küche','wohnzimmer':'Wohnzimmer'}
                  -%}

                  {%- for k, n in rooms.items() if
                  is_state('binary_sensor.luftungsempfehlung_' ~ k, 'on') -%}{%-
                  set ns.l = ns.l + [n] -%}{%- endfor -%}

                  {%- set mob = integration_entities('mobile_app') -%}

                  {%- for s in states.sensor |
                  selectattr('attributes.device_class','defined') |
                  selectattr('attributes.device_class','eq','battery') |
                  sort(attribute='state') if s.entity_id not in mob and s.state
                  | is_number and s.state | float <= 30 -%}

                  {%- set n = s.name | replace(' Batterie','') -%}{%- set
                  ns.names = ns.names + [n] -%}{%- set ns.b = ns.b + ['**' ~ n ~
                  '** – ' ~ (s.state | float | round(0) | int) ~ ' %'] -%}

                  {%- endfor -%}

                  {%- for s in states.binary_sensor |
                  selectattr('attributes.device_class','defined') |
                  selectattr('attributes.device_class','eq','battery') |
                  selectattr('state','eq','on') if s.entity_id not in mob -%}

                  {%- set n = s.name | replace(' Batteriestand','') -%}{%- if n
                  not in ns.names -%}{%- set ns.b = ns.b + ['**' ~ n ~ '** –
                  niedrig'] -%}{%- endif -%}

                  {%- endfor -%}

                  <ha-icon icon="mdi:window-open-variant"></ha-icon> **Lüften:**
                  {{ ns.l | join(', ') if ns.l else 'gerade nicht nötig ✓' }}


                  <ha-icon icon="mdi:battery-alert-variant-outline"></ha-icon>
                  **Batterien ≤ 30 %:** {% if ns.b %}

                  {% for x in ns.b %}- {{ x }}

                  {% endfor %}{% else %}alle ok ✓{% endif %}
                card_mod:
                  style: 'ha-card { border-radius: 14px; }'
        card_mod:

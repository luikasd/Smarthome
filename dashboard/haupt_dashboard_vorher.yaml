            #root {
              grid-template-columns: minmax(240px, 1fr) minmax(0, 2.4fr) minmax(240px, 1fr) !important;
              gap: 20px !important; align-items: start; padding: 16px; box-sizing: border-box; max-width: 1900px; margin: 0 auto;
            }
            @media (max-width: 1150px) {
              #root { grid-template-columns: 1fr 1fr !important; gap: 14px !important; padding: 10px; }
              #root > :nth-child(2) { order: -1; grid-column: 1 / -1; }
            }
            @media (max-width: 640px) {
              #root { grid-template-columns: 1fr !important; gap: 12px !important; padding: 6px 4px; }
            }
